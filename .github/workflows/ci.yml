name: CI

# Build e suite completa a cada push na main e em todo pull request.
#
# Mudanca apenas de documentacao nao dispara o pipeline: o repositorio tem muito
# markdown vivo (registro de etapas, ADRs) e rodar Testcontainers para corrigir
# uma frase queimaria minutos de Actions sem provar nada.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  #  Trava de visibilidade
  # ---------------------------------------------------------------------------
  #  O repositorio precisa permanecer privado. O codigo expoe a logica de deteccao
  #  de inconsistencias e as fixtures com dado real de fornecedores — abri-lo por
  #  engano seria dificil de desfazer, porque forks e caches sobrevivem ao fechamento.
  #
  #  Este job falha o pipeline se a visibilidade mudar, servindo de alarme.
  visibilidade:
    name: Repositório continua privado
    runs-on: ubuntu-latest
    steps:
      - name: Verificar visibilidade
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::O repositório está PÚBLICO. Ele deve permanecer privado."
            exit 1
          fi
          echo "Repositório privado, como esperado."

  # ---------------------------------------------------------------------------
  #  Frontend
  # ---------------------------------------------------------------------------
  #  Ate aqui o CI nao tocava no frontend: 106 testes, o lint e o tsc cresceram
  #  desde a Etapa 06 sem nunca terem rodado fora da maquina de quem escreveu.
  #
  #  O build de producao roda aqui em Linux, que e' onde ele vai rodar de verdade
  #  (ADR-0019: Node na VPS, `output: "standalone"`).
  frontend:
    name: Frontend — testes e build standalone
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Sem API alcancavel aqui, e isso e' esperado: o build degrada para as
      # rotas que nao dependem dela e continua provando o que este passo existe
      # para provar — que o servidor standalone monta sem quebrar. O build de
      # verdade, com as ~870 paginas, e' o da VPS, com a API de pe.
      - name: Build de producao
        run: npm run build

      - name: Conferir que o servidor standalone foi gerado
        run: test -f .next/standalone/server.js

  # ---------------------------------------------------------------------------
  #  Empacotamento
  # ---------------------------------------------------------------------------
  #  Constroi as duas imagens sem publicar, para arm64 — a arquitetura da VPS da
  #  Oracle (ADR-0019). O .NET compila cruzado (ver backend/Dockerfile), entao o
  #  runner x64 gera a imagem ARM sem emulacao. O build em si ja protege contra a
  #  classe de erro que so' aparece dentro do conteiner.
  #
  #  Ela e' real: a primeira versao do Dockerfile compilava aqui e falhava la',
  #  porque o .editorconfig nao viajava no contexto e os analisadores passavam a
  #  reprovar as migrations que o proprio EF Core gera. Com TreatWarningsAsErrors,
  #  isso e' build vermelho — e so' o build do conteiner mostra.
  imagens:
    name: Imagens da API e do worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-e-testes

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem da API
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: api
          platforms: linux/arm64
          push: false
          tags: explanando-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir a imagem do worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: worker
          platforms: linux/arm64
          push: false
          tags: explanando-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  #  Build e testes
  # ---------------------------------------------------------------------------
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # O cache usa o lock implícito dos Directory.Packages.props: como as versões
      # são centralizadas, uma mudança neles invalida o cache corretamente.
      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependências
        working-directory: backend
        run: dotnet restore Explanando.slnx

      # TreatWarningsAsErrors está ligado na solution: aviso aqui reprova o build,
      # que é o comportamento desejado (ADR-0005).
      - name: Compilar
        working-directory: backend
        run: dotnet build Explanando.slnx --configuration Release --no-restore

      # Os testes de integração sobem Postgres via Testcontainers. O runner
      # ubuntu-latest já traz Docker, então não é preciso serviço declarado —
      # e usar Testcontainers aqui mantém o teste idêntico ao que roda local.
      - name: Executar testes
        working-directory: backend
        run: >
          dotnet test Explanando.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=resultados.trx"
          --results-directory ../artefatos-de-teste
          --collect:"XPlat Code Coverage"

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-teste
          path: artefatos-de-teste
          retention-days: 14

      # Modelo alterado sem migration correspondente é um erro que só apareceria no
      # deploy. Aqui aparece no pull request.
      #
      # Vive dentro deste job, e não num job próprio, para reaproveitar o restore e o
      # build que já aconteceram — em repositório privado os minutos de Actions são
      # cota, e um job separado repetiria os dois passos mais caros do pipeline.
      - name: Restaurar ferramentas locais
        working-directory: backend
        run: dotnet tool restore

      # `has-pending-model-changes` sai com 0 quando está tudo em sincronia. Mas ele
      # também sai diferente de zero por qualquer outra falha (assets ausentes, erro de
      # build), e culpar o modelo nesses casos manda o desenvolvedor investigar a coisa
      # errada. A saída é inspecionada para distinguir os dois casos.
      - name: Verificar se há mudança de modelo sem migration
        working-directory: backend
        run: |
          set +e
          saida=$(dotnet ef migrations has-pending-model-changes \
                    --project src/Explanando.Infrastructure \
                    --startup-project src/Explanando.Api \
                    --no-build --configuration Release 2>&1)
          codigo=$?
          set -e

          echo "$saida"
          [ "$codigo" -eq 0 ] && exit 0

          if echo "$saida" | grep -qi "changes have been made to the model"; then
            echo "::error::O modelo mudou sem migration correspondente. Rode 'dotnet ef migrations add <Nome>'."
          else
            echo "::error::A verificação de migrations falhou por outro motivo — veja a saída acima."
          fi
          exit 1
